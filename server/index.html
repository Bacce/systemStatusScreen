<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, height=540, initial-scale=1.0">
    <title>Homelab Status</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 540px;
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Overall layout table */
        .main-table {
            width: 800px;
            height: 540px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        /* Header/Footer cells */
        .cell-header,
        .cell-footer {
            padding: 10px 20px;
            vertical-align: middle;
        }

        .header-content {
            border-bottom: 4px solid #000;
            width: 100%;
            padding-bottom: 5px;
        }

        .title {
            float: left;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 70px;
        }

        .time {
            float: right;
            font-size: 54px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 70px;
        }

        /* Metrics cells - Applying border directly to TD for uniform height */
        .cell-metric {
            border: 3px solid #000;
            padding: 15px;
            vertical-align: top;
        }

        .label {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .value {
            font-family: "Courier New", monospace;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        /* CPU/RAM/Disk bars */
        .bar {
            width: 100%;
            height: 22px;
            border: 3px solid #000;
            margin-top: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 16px;
            background: #000;
            width: 0%;
        }

        /* Footer */
        .footer-content {
            border-top: 4px solid #000;
            width: 100%;
            padding-top: 5px;
        }

        .footer-label {
            float: left;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 60px;
        }

        .uptime {
            float: right;
            font-family: "Courier New", monospace;
            font-size: 28px;
            font-weight: 700;
            line-height: 60px;
        }

        #error-message {
            position: absolute;
            top: 150px;
            left: 100px;
            width: 600px;
            font-size: 48px;
            font-weight: bold;
            color: #000;
            text-align: center;
            display: none;
            z-index: 100;
            background: #fff;
            padding: 20px;
            border: 5px solid #000;
        }
    </style>
</head>

<body>

    <table class="main-table">
        <!-- Header Row -->
        <tr style="height: 100px;">
            <td colspan="2" class="cell-header">
                <div class="header-content">
                    <div class="title">SYSTEM STATUS</div>
                    <div class="time" id="time">00:00</div>
                </div>
            </td>
        </tr>

        <!-- Metrics Row 1 -->
        <tr>
            <td class="cell-metric">
                <div class="label">IP Address</div>
                <div class="value" id="stat-ip">...</div>
            </td>
            <td class="cell-metric">
                <div class="label">CPU</div>
                <div class="value" id="stat-cpu">...</div>
                <div class="bar">
                    <div class="bar-fill" id="bar-cpu"></div>
                </div>
            </td>
        </tr>

        <!-- Metrics Row 2 -->
        <tr>
            <td class="cell-metric">
                <div class="label">RAM</div>
                <div class="value" id="stat-ram">...</div>
                <div class="bar">
                    <div class="bar-fill" id="bar-ram"></div>
                </div>
            </td>
            <td class="cell-metric">
                <div class="label">DISK</div>
                <div class="value" id="stat-disk">...</div>
                <div class="bar">
                    <div class="bar-fill" id="bar-disk"></div>
                </div>
            </td>
        </tr>

        <!-- Footer Row -->
        <tr style="height: 80px;">
            <td colspan="2" class="cell-footer">
                <div class="footer-content">
                    <div class="footer-label">UPTIME</div>
                    <div class="uptime" id="stat-uptime">...</div>
                </div>
            </td>
        </tr>
    </table>

    <div id="error-message">SERVER CONNECTION ERROR</div>

    <script type="text/javascript">
        function updateScreen() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/status', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var timeStr = data.time;
                            if (timeStr.split(':').length > 2) {
                                timeStr = timeStr.substring(0, 5);
                            }
                            document.getElementById("time").innerHTML = timeStr;
                            document.getElementById("stat-ip").innerHTML = data.ip;
                            document.getElementById("stat-cpu").innerHTML = data.cpu;
                            document.getElementById("stat-ram").innerHTML = data.ram;
                            document.getElementById("stat-disk").innerHTML = data.disk;
                            document.getElementById("stat-uptime").innerHTML = data.uptime;
                            document.getElementById("error-message").style.display = "none";

                            var cpuVal = parseInt(data.cpu);
                            if (!isNaN(cpuVal)) {
                                document.getElementById("bar-cpu").style.width = cpuVal + "%";
                            }

                            var ramParts = data.ram.split(' / ');
                            if (ramParts.length === 2) {
                                var ramUsed = parseFloat(ramParts[0]);
                                var ramTotal = parseFloat(ramParts[1]);
                                if (!isNaN(ramUsed) && !isNaN(ramTotal)) {
                                    document.getElementById("bar-ram").style.width = (ramUsed / ramTotal * 100) + "%";
                                }
                            }

                            var diskParts = data.disk.split(' / ');
                            if (diskParts.length === 2) {
                                var diskUsed = parseFloat(diskParts[0]);
                                var diskTotal = parseFloat(diskParts[1]);
                                if (!isNaN(diskUsed) && !isNaN(diskTotal)) {
                                    document.getElementById("bar-disk").style.width = (diskUsed / diskTotal * 100) + "%";
                                }
                            }

                            setTimeout(updateScreen, data.updateInterval || 60000);
                        } catch (e) {
                            console.error('Error parsing JSON:', e);
                            document.getElementById("error-message").style.display = "block";
                            setTimeout(updateScreen, 60000);
                        }
                    } else {
                        document.getElementById("error-message").style.display = "block";
                        setTimeout(updateScreen, 60000);
                    }
                }
            };
            xhr.onerror = function () {
                document.getElementById("error-message").style.display = "block";
                setTimeout(updateScreen, 60000);
            };
            xhr.send();
        }

        updateScreen();
    </script>
</body>

</html>
