<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Landing</title>
    <style>
        :root {
            --bg-color: #ece6d9;
            --panel-color: #f5f0e6;
            --accent-orange: #d97706;
            --muted-orange: #b45309;
            --text-dark: #4a4a4a;
            --border-color: #c5bba9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --inset-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-display {
            position: relative;
            width: 90%;
            max-width: 400px;
            margin-bottom: 30px;
            padding: 20px;
            border: 3px solid var(--border-color);
            border-radius: 24px;
            text-align: center;
            font-size: 0.9rem;
            background: var(--panel-color);
            box-shadow: var(--inset-shadow);
        }

        .status-display .title {
            font-weight: bold;
            color: var(--muted-orange);
            display: block;
            margin-bottom: 5px;
        }

        .status-display .status {
            font-weight: normal;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .status-display .cover {
            width: 60px;
            height: 60px;
            object-fit: cover;
            margin-bottom: 10px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }

        .ui-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 90%;
            max-width: 400px;
            padding: 32px 24px;
            border: 4px solid var(--border-color);
            border-radius: 40px;
            background: var(--panel-color);
            box-shadow: var(--shadow);
        }

        .ui-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--muted-orange);
            font-weight: 900;
            text-align: center;
            opacity: 0.8;
        }

        .retro-btn {
            position: relative;
            width: 100%;
            padding: 18px 0;
            background: var(--accent-orange);
            color: white;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
            text-decoration: none;
            border-radius: 20px;
            box-shadow: 0 4px 0 var(--muted-orange);
            display: block;
            box-sizing: border-box;
        }

        .retro-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--muted-orange);
        }

        .retro-btn.alt {
            background: transparent;
            color: var(--muted-orange);
            border: 3px solid var(--muted-orange);
            box-shadow: 0 4px 0 var(--border-color);
        }

        .retro-btn.alt:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--border-color);
        }
    </style>
</head>

<body>

    <div id="status-display" class="status-display">
        <div id="status-header"
            style="font-size: 20px; font-weight: 900; color: var(--muted-orange); display: flex; justify-content: space-between; align-items: center;">
            <span>Control Panel</span>
            <span id="current-time" style="font-size: 0.8rem; opacity: 0.7;"></span>
        </div>
    </div>

    <div class="ui-container">
        <div class="ui-title" style="display:none;">Control Panel</div>

        <a href="http://192.168.68.60:8096/web/index.html" class="retro-btn">Jellyfin</a>
        <a href="http://192.168.68.60:32400/web/index.html" class="retro-btn">Plex</a>
        <div style="height: 24px;"></div>
        <a href="http://192.168.68.60:12345/" class="retro-btn alt">Shutdown</a>
    </div>

    <script>
        function updateTime() {
            const el = document.getElementById('current-time');
            if (!el) return;
            const now = new Date();
            el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);
